<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(277, 50%, 45%)" />
      <stop offset="100%" stop-color="hsl(233, 47%, 20%)" />
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="hsl(277, 90%, 70%)" stop-opacity="0.55" />
      <stop offset="100%" stop-color="hsl(277, 90%, 70%)" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="700" height="500" fill="url(#baseGradient)" />
  <rect width="700" height="500" fill="url(#glow)" />

  <!-- Abstract shapes suggesting a network / people connecting, echoing the "insights" theme -->
  <g fill="none" stroke="hsla(0,0%,100%,0.35)" stroke-width="1.5">
    <circle cx="150" cy="120" r="70" />
    <circle cx="420" cy="90" r="45" />
    <circle cx="560" cy="260" r="90" />
    <circle cx="230" cy="360" r="55" />
    <line x1="150" y1="120" x2="420" y2="90" />
    <line x1="420" y1="90" x2="560" y2="260" />
    <line x1="560" y1="260" x2="230" y2="360" />
    <line x1="230" y1="360" x2="150" y2="120" />
  </g>

  <g fill="hsla(0,0%,100%,0.9)">
    <circle cx="150" cy="120" r="8" />
    <circle cx="420" cy="90" r="8" />
    <circle cx="560" cy="260" r="8" />
    <circle cx="230" cy="360" r="8" />
  </g>

  <g fill="hsla(0,0%,100%,0.12)">
    <circle cx="80" cy="420" r="120" />
    <circle cx="620" cy="60" r="100" />
  </g>
</svg>
