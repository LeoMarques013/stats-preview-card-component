<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card de Prévia de Estatísticas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <article class="card">
      <section class="card__content">
        <h1 class="card__title">
          Obtenha <span class="highlight">informações</span> que ajudam sua empresa a crescer.
        </h1>
        <p class="card__description">
          Descubra os benefícios da análise de dados e tome melhores decisões
          em relação ao público do seu negócio.
        </p>

        <dl class="card__stats">
          <div class="stat">
            <dt class="stat__label">Empresas</dt>
            <dd class="stat__value">10 mil+</dd>
          </div>
          <div class="stat">
            <dt class="stat__label">Transações</dt>
            <dd class="stat__value">314 mi+</dd>
          </div>
          <div class="stat">
            <dt class="stat__label">Países</dt>
            <dd class="stat__value">12</dd>
          </div>
        </dl>
      </section>

      <aside class="card__image" aria-hidden="true"></aside>
    </article>
  </main>
</body>
</html>
